services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: neurotune
      POSTGRES_PASSWORD: neurotune
      POSTGRES_DB: neurotune
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neurotune"]
      interval: 2s
      timeout: 5s
      retries: 20

  migrate:
    build: &backend-build
      context: .
      dockerfile: backend/Dockerfile
    command: ["sh", "-c", "python -m app.wait_for_db && alembic upgrade head"]
    environment: &backend-environment
      DATABASE_URL: postgresql+psycopg://neurotune:neurotune@db:5432/neurotune
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      AUDIO_DATA_DIR: /data/audio
      RAW_DATA_DIR: /data/raw
      CONTRACTS_PATH: /srv/contracts/default_experiment.json
    volumes: &backend-volumes
      - raw:/data/raw
      - audio:/data/audio
    depends_on:
      db:
        condition: service_healthy

  api:
    build: *backend-build
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *backend-environment
    ports:
      - "8000:8000"
    volumes: *backend-volumes
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: *backend-build
    command: ["python", "-m", "app.worker"]
    environment: *backend-environment
    volumes: *backend-volumes
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  raw:
  audio:
