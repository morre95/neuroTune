[project]
name = "neurotune-backend"
version = "0.1.0"
description = "Accounts, session upload, and personal bandit statistics for neuroTune."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116",
  "uvicorn[standard]>=0.35",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.16",
  "pwdlib[argon2]>=0.3",
  "pyjwt>=2.10",
  "pydantic-settings>=2.10",
  "email-validator>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.4", "httpx2>=2.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
